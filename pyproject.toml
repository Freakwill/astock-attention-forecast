[project]
name = "astock-attention-forecast"
version = "0.1.0"
description = "Multivariate A-share panel dataset + self-attention multi-step return forecasting, with an LLM news-sentiment overlay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # akshare 1.18 still assumes pandas 2.x dtypes: on pandas 3.x string columns
    # are PyArrow-backed and its `.str.replace(r"\u3000", ..., regex=True)` calls
    # raise ArrowInvalid (RE2 rejects \u escapes).
    "pandas>=2.0,<3.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "fire>=0.5",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "torch>=2.2",
    "baostock>=0.8.9",
    "akshare>=1.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aaf = "astock_af.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
